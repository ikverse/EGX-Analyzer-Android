<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EGX chart</title>
<style>
  /* The app's figures face, bundled beside this page so it stays offline. */
  @font-face { font-family: "EGX Mono"; src: url("jetbrains_mono.ttf"); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  #chart { position: absolute; inset: 0; touch-action: none; }
  #empty { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font: 14px "EGX Mono", monospace; color: var(--muted); display: none; }
  .ctl { position: absolute; display: flex; gap: 4px; z-index: 5; }
  /* The kit's capsules: a raised fill, the ink word, and ink with the ground's word when on. */
  .ctl button { font: 600 12px "EGX Mono", monospace; min-width: 32px; height: 28px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--raised); color: var(--text); }
  .ctl button.on { background: var(--text); color: var(--onInk); }
  #latest { display: none; }
  #latest button { font-size: 14px; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="empty">No sessions stored in this range.</div>
<!-- Under the price axis's foot, where TradingView keeps them: back to the auto-fit, log, percent. -->
<div id="scales" class="ctl"><button id="sAuto" class="on">A</button><button id="sLog">L</button><button id="sPct">%</button></div>
<!-- Back to the newest session, offered only once the reader has scrolled away from it. -->
<div id="latest" class="ctl"><button id="toLatest" aria-label="Go to the latest session">»</button></div>
<script src="klinecharts.min.js"></script>
<script>
  // The app draws the toolbar and owns the data; this page draws the chart and the controls that sit on it. The app tells it things through
  // egxChart.setData / draw / undo / clearDrawings, and reads back what the reader changed here through egxChart.state().
  var PANE = 'candle_pane';
  var FONT = '"EGX Mono", monospace';
  var theme = null, style = 'candles', scaleType = 'normal', manual = false, lastRows = [], lastLevels = [], showLevels = true, lastCalls = [], lastKey = null;
  var chart = klinecharts.init('chart', { locale: 'en-US' });
  // The canvas draws with the face only once it has loaded, so the chart is redrawn when it lands.
  if (document.fonts && document.fonts.load) {
    document.fonts.load('12px "EGX Mono"').then(function () { try { chart.resize(); } catch (e) {} });
  }
  try { chart.setTimezone('UTC'); } catch (e) { /* the app sends each session at noon UTC, so the day is the same in every timezone anyway */ }

  // A session is a day, so the crosshair and the tooltip say the day and not the hour the library would append.
  chart.setCustomApi({
    formatDate: function (dtf, timestamp, format, type) {
      var p = {};
      dtf.formatToParts(new Date(timestamp)).forEach(function (x) { p[x.type] = x.value; });
      var tokens = { YYYY: p.year, MM: p.month, DD: p.day, HH: p.hour, mm: p.minute };
      if (type !== klinecharts.FormatDateType.XAxis) format = format.replace(' HH:mm', '');
      return format.replace(/YYYY|MM|DD|HH|mm/g, function (t) { return tokens[t]; });
    }
  });

  // Carries the level prices to the price axis so the scale fits them. Drawn in no colour and listed nowhere: the lines themselves are overlays.
  var KEYS = ['v0', 'v1', 'v2', 'v3', 'v4', 'v5'];
  var fit = [];
  klinecharts.registerIndicator({
    name: 'FIT', shortName: '', series: 'price', calcParams: [],
    figures: KEYS.map(function (k) { return { key: k, title: '', type: 'line', styles: function () { return { color: 'rgba(0,0,0,0)', size: 0 }; } }; }),
    calc: function (list) {
      return list.map(function () {
        var row = {};
        fit.forEach(function (v, i) { row[KEYS[i]] = v; });
        return row;
      });
    },
    createTooltipDataSource: function () { return { name: '', calcParamsText: '', values: [], icons: [] }; }
  });
  chart.createIndicator('FIT', true, { id: PANE });

  // --- Indicators. The ones drawn over the price share its pane; the rest each get a pane of their own under it, as in TradingView.
  var OVER_PRICE = { MA: [5, 10, 30], EMA: [9, 21, 50], BOLL: [20, 2], SAR: null };
  var OWN_PANE = { VOL: [], MACD: [12, 26, 9], RSI: [14], KDJ: [9, 3, 3] };
  var ORDER = ['MA', 'EMA', 'BOLL', 'SAR', 'VOL', 'MACD', 'RSI', 'KDJ'];
  var active = {}; // name -> the pane it is drawn in
  var lastWanted = null;

  function addIndicator(name) {
    if (active[name] || !(name in OVER_PRICE || name in OWN_PANE)) return;
    var over = name in OVER_PRICE;
    var params = over ? OVER_PRICE[name] : OWN_PANE[name];
    var value = params === null ? { name: name } : { name: name, calcParams: params };
    var pane = over ? PANE : 'pane_' + name;
    try {
      if (over) chart.createIndicator(value, true, { id: PANE });
      else chart.createIndicator(value, false, { id: pane, height: name === 'VOL' ? 70 : 90, minHeight: 40 });
      active[name] = pane;
    } catch (e) {}
  }
  function removeIndicator(name) {
    if (!active[name]) return;
    try { chart.removeIndicator(active[name], name); } catch (e) {}
    delete active[name];
    redrawSoon();
  }
  // Applied only when the app's list changes, so a payload re-sent with a list from before the reader pressed × on one here does not put it back.
  function setIndicators(names) {
    var key = (names || []).slice().sort().join(',');
    if (key === lastWanted) return;
    lastWanted = key;
    var wanted = {};
    (names || []).forEach(function (n) { wanted[n] = true; });
    Object.keys(active).forEach(function (n) { if (!wanted[n]) removeIndicator(n); });
    ORDER.forEach(function (n) { if (wanted[n]) addIndicator(n); });
  }
  try {
    chart.subscribeAction('onTooltipIconClick', function (d) {
      if (d && d.iconId === 'remove' && d.indicatorName) removeIndicator(d.indicatorName);
    });
  } catch (e) {}

  // A ring where a call was made.
  klinecharts.registerOverlay({
    name: 'callMark', totalStep: 2, lock: true, needDefaultPointFigure: false, needDefaultXAxisFigure: false, needDefaultYAxisFigure: false,
    createPointFigures: function (o) {
      var c = o.coordinates[0];
      return [{ type: 'circle', attrs: { x: c.x, y: c.y - 10, r: 5 }, styles: { style: 'stroke_fill', color: theme ? theme.bg : '#000', borderColor: theme ? theme.muted : '#868993', borderSize: 1.5 } }];
    }
  });

  function fmt(v) {
    if (v === undefined || v === null || !isFinite(v)) return '–';
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: v >= 1000 ? 0 : 3 });
  }
  function fmtVolume(v) {
    if (!isFinite(v) || v <= 0) return '–';
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    return String(Math.round(v));
  }

  // The price strip, TradingView's way: O H L C in the colour of the session, then its change from the one before, then the volume.
  function legend(data) {
    var cur = (data && data.current) || null;
    if (!cur) return [];
    var prev = data.prev || null;
    var base = prev ? prev.close : cur.open;
    var change = cur.close - base;
    var color = change > 0 ? theme.up : change < 0 ? theme.down : theme.muted;
    function item(t, v, c) { return { title: { text: t, color: theme.muted }, value: { text: v, color: c || color } }; }
    var pct = base ? (change / base * 100) : 0;
    var sign = change > 0 ? '+' : '';
    return [
      item('O ', fmt(cur.open)), item('H ', fmt(cur.high)), item('L ', fmt(cur.low)), item('C ', fmt(cur.close)),
      item('', sign + fmt(change) + ' (' + sign + pct.toFixed(2) + '%)'),
      item('Vol ', fmtVolume(cur.volume), theme.text)
    ];
  }

  function candleType() {
    return { candles: 'candle_solid', hollow: 'candle_stroke', bars: 'ohlc', line: 'area', area: 'area' }[style] || 'candle_solid';
  }

  function applyTheme(t) {
    theme = t;
    document.body.style.background = t.bg;
    var root = document.documentElement.style;
    root.setProperty('--bg', t.bg); root.setProperty('--rule', t.rule); root.setProperty('--muted', t.muted); root.setProperty('--text', t.text);
    root.setProperty('--raised', t.raised || t.rule); root.setProperty('--onInk', t.onInk || t.bg);
    var LINE = { style: 'solid', smooth: false, size: 1, dashedValue: [2, 2] };
    // The indicators' lines: cobalt first, then the kit's tile hues taken deep enough to read on paper.
    var palette = [t.line, '#D49A00', '#7C5CFF', '#FF6B4A', '#2E9BE6'];
    var fill = style === 'area' ? t.line + '40' : 'rgba(0,0,0,0)';
    chart.setStyles({
      grid: { horizontal: { color: t.rule }, vertical: { color: t.rule } },
      candle: {
        type: candleType(),
        bar: { upColor: t.up, downColor: t.down, noChangeColor: t.muted, upBorderColor: t.up, downBorderColor: t.down, noChangeBorderColor: t.muted, upWickColor: t.up, downWickColor: t.down, noChangeWickColor: t.muted },
        area: { lineSize: 2, lineColor: t.line, smooth: false, backgroundColor: [{ offset: 0, color: 'rgba(0,0,0,0)' }, { offset: 1, color: fill }] },
        priceMark: {
          high: { color: t.muted, textFamily: FONT }, low: { color: t.muted, textFamily: FONT },
          last: { upColor: t.up, downColor: t.down, noChangeColor: t.muted, line: { style: 'dashed' }, text: { family: FONT } }
        },
        tooltip: { showRule: 'always', showType: 'standard', custom: legend, text: { size: 12, color: t.muted, family: FONT, marginLeft: 8, marginTop: 6, marginRight: 4, marginBottom: 0 } }
      },
      indicator: {
        ohlc: { upColor: t.up + '80', downColor: t.down + '80', noChangeColor: t.muted },
        bars: [{ upColor: t.up + '80', downColor: t.down + '80', noChangeColor: t.muted }],
        lines: palette.map(function (c) { return Object.assign({ color: c }, LINE); }),
        circles: [{ upColor: t.up, downColor: t.down, noChangeColor: t.muted }],
        tooltip: {
          showRule: 'always', showName: true, showParams: true,
          text: { size: 12, color: t.muted, family: FONT, marginLeft: 8, marginTop: 4, marginRight: 4, marginBottom: 0 },
          // The × that takes an indicator off, beside its name.
          icons: [{ id: 'remove', position: 'middle', marginLeft: 6, marginTop: 3, marginRight: 4, marginBottom: 0, paddingLeft: 4, paddingTop: 0, paddingRight: 4, paddingBottom: 0,
            icon: '×', fontFamily: FONT, size: 14, color: t.muted, activeColor: t.text, backgroundColor: 'rgba(0,0,0,0)', activeBackgroundColor: t.rule }]
        }
      },
      xAxis: { axisLine: { color: t.rule }, tickLine: { color: t.rule }, tickText: { color: t.muted, family: FONT } },
      yAxis: { axisLine: { color: t.rule }, tickLine: { color: t.rule }, tickText: { color: t.muted, family: FONT } },
      separator: { color: t.rule },
      crosshair: {
        horizontal: { line: { color: t.muted }, text: { backgroundColor: t.rule, color: t.text, borderColor: t.rule, family: FONT } },
        vertical: { line: { color: t.muted }, text: { backgroundColor: t.rule, color: t.text, borderColor: t.rule, family: FONT } }
      },
      // What the reader draws, in the market blue the line is drawn in.
      overlay: {
        point: { color: t.line, borderColor: t.line + '55', activeColor: t.line, activeBorderColor: t.line + '55' },
        line: { color: t.line, size: 1.5 },
        rect: { color: t.line + '22', borderColor: t.line },
        polygon: { color: t.line + '22', borderColor: t.line },
        text: { color: t.text, family: FONT, size: 12 },
        rectText: { color: '#ffffff', backgroundColor: t.line, borderColor: t.line, family: FONT, size: 12 }
      }
    });
  }

  function clear(group) { try { chart.removeOverlay({ groupId: group }); } catch (e) {} }

  function levelColor(kind) {
    return { stop: theme.stop, target: theme.target, entry: theme.entry, paid: theme.paid }[kind] || theme.muted;
  }

  // Draws every level where it really is. One the scale does not reach - past the cap in the auto-fit, or off the screen after the axis
  // has been dragged - is pinned to the edge it passed and marked with an arrow, which is what the native chart does too.
  function drawLevels() {
    clear('levels');
    if (!showLevels || !lastRows.length) return;
    var size = null;
    try { size = chart.getSize(PANE, 'main'); } catch (e) {}
    if (!size) return;
    var ts = lastRows[lastRows.length - 1].timestamp;
    var edge = 14;
    lastLevels.forEach(function (l) {
      var value = l.price, label = l.label;
      try {
        var y = chart.convertToPixel({ value: l.price }, { paneId: PANE }).y;
        if (y < edge) { value = chart.convertFromPixel({ y: edge }, { paneId: PANE }).value; label = '↑ ' + label; }
        else if (y > size.height - edge) { value = chart.convertFromPixel({ y: size.height - edge }, { paneId: PANE }).value; label = '↓ ' + label; }
      } catch (e) {}
      var color = levelColor(l.kind);
      var solid = l.kind === 'paid';
      chart.createOverlay({
        name: 'horizontalStraightLine', groupId: 'levels', lock: true, points: [{ timestamp: ts, value: value }],
        styles: { line: { color: color, size: 1, style: solid ? 'solid' : 'dashed', dashedValue: [4, 4] } }
      });
      chart.createOverlay({
        name: 'simpleTag', groupId: 'levels', lock: true, extendData: label, points: [{ timestamp: ts, value: value }],
        styles: { text: { color: '#ffffff', backgroundColor: color, borderColor: color }, line: { color: color } }
      });
    });
  }

  function drawCalls() {
    clear('calls');
    var wanted = {};
    lastCalls.forEach(function (t) { wanted[t] = true; });
    var onLine = style === 'line' || style === 'area';
    lastRows.forEach(function (r) {
      if (wanted[r.timestamp]) chart.createOverlay({ name: 'callMark', groupId: 'calls', lock: true, points: [{ timestamp: r.timestamp, value: onLine ? r.close : r.high }] });
    });
  }

  // --- Drawings. Each one the reader makes is kept by id, in order, so Undo takes the newest off; state() hands them all back for the app to keep.
  var TOOLS = { trend: 'segment', ray: 'rayLine', hline: 'horizontalStraightLine', hray: 'horizontalRayLine', vline: 'verticalStraightLine',
    channel: 'parallelStraightLine', fib: 'fibonacciLine', note: 'simpleAnnotation' };
  var drawn = [];      // ids, oldest first
  var pending = null;  // the id of the one being placed, until its last point lands
  var restored = false;

  function drawingOptions(name, points, extendData) {
    var o = { name: name, groupId: 'drawings', lock: false, onDrawEnd: function (e) { if (e && e.overlay && pending === e.overlay.id) pending = null; return false; },
      onRemoved: function (e) { var id = e && e.overlay && e.overlay.id; drawn = drawn.filter(function (x) { return x !== id; }); if (pending === id) pending = null; return false; } };
    if (points) o.points = points;
    if (extendData !== undefined && extendData !== null) o.extendData = extendData;
    return o;
  }

  function draw(tool, text) {
    cancelPending();
    var name = TOOLS[tool];
    if (!name) return;
    var id = null;
    try { id = chart.createOverlay(drawingOptions(name, null, tool === 'note' ? (text || 'Note') : null)); } catch (e) {}
    if (id) { drawn.push(id); pending = id; }
  }
  function cancelPending() {
    if (pending) { var id = pending; pending = null; try { chart.removeOverlay({ id: id }); } catch (e) {} drawn = drawn.filter(function (x) { return x !== id; }); }
  }
  function undo() {
    if (pending) { cancelPending(); return; }
    var id = drawn.pop();
    if (id) try { chart.removeOverlay({ id: id }); } catch (e) {}
  }
  function clearDrawings() { pending = null; drawn = []; clear('drawings'); }

  function serialize() {
    var out = [];
    drawn.forEach(function (id) {
      if (id === pending) return;
      var o = null;
      try { o = chart.getOverlayById(id); } catch (e) {}
      if (!o || !o.points || !o.points.length) return;
      out.push({ name: o.name, points: o.points.map(function (p) { return { timestamp: p.timestamp, value: p.value }; }), text: o.extendData === undefined ? null : o.extendData });
    });
    return out;
  }
  function restore(list) {
    (list || []).forEach(function (d) {
      if (!d || !d.name || !d.points) return;
      var known = false;
      Object.keys(TOOLS).forEach(function (k) { if (TOOLS[k] === d.name) known = true; });
      if (!known) return;
      var id = null;
      try { id = chart.createOverlay(drawingOptions(d.name, d.points, d.text)); } catch (e) {}
      if (id) drawn.push(id);
    });
  }

  var queued = false;
  function redrawSoon() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; drawLevels(); placeControls(); });
  }

  // The scale may grow to fit the levels, but only so far: honouring a target the stock has been nowhere near would squash the candles
  // into a line. Past the cap a level is left out of the fit and pinned instead.
  function fitValues(rows, levels, growth) {
    var lo = Infinity, hi = -Infinity;
    rows.forEach(function (r) { if (r.low < lo) lo = r.low; if (r.high > hi) hi = r.high; });
    var span = (hi - lo) || hi * 0.02 || 1, room = span * (growth - 1) / 2;
    return levels.map(function (l) { return l.price; }).filter(function (p) { return p >= lo - room && p <= hi + room; }).slice(0, KEYS.length);
  }

  function setData(d) {
    style = d.style || 'candles';
    applyTheme(d.theme);
    var rows = (d.candles || []).map(function (c) { return { timestamp: c[0], open: c[1], high: c[2], low: c[3], close: c[4], volume: c[5] }; });
    document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
    showLevels = !!d.showLevels; lastCalls = d.calls || []; lastLevels = d.levels || [];
    // Another range, another type or another stock starts on the auto-fit again; the same chart redrawn keeps the reader's own scale.
    var another = d.key !== lastKey;
    lastKey = d.key;
    fit = showLevels ? fitValues(rows, lastLevels, d.growth || 2.5) : [];
    setIndicators(d.indicators || ['VOL']);
    chart.overrideIndicator({ name: 'FIT', calcParams: [] }); // forces the carried prices to be taken again
    // New sessions under the drawings: taken off and put back by their dates, so a line drawn three months back survives a press of 1W.
    var ends = function (list) { return list.length ? [list[0].timestamp, list[list.length - 1].timestamp, list[list.length - 1].close].join('|') : ''; };
    var dataChanged = rows.length !== lastRows.length || ends(rows) !== ends(lastRows);
    var reload = dataChanged || another || !chart.getDataList().length;
    var keep = reload && restored ? serialize() : null;
    if (keep) { pending = null; drawn = []; clear('drawings'); }
    lastRows = rows;
    if (reload) chart.applyNewData(rows);
    if (keep) restore(keep);
    if (!restored) {
      restored = true;
      var saved = d.drawings;
      if (typeof saved === 'string') { try { saved = JSON.parse(saved); } catch (e) { saved = null; } }
      restore(saved);
    }
    if (another) autoScale();
    drawCalls();
    drawLevels();
    redrawSoon();
  }

  // --- The price scale. Auto goes back to the fit; L and % swap the axis for a log or a percentage one and are each other's off switch.
  function setScaleType(type) {
    scaleType = type;
    autoScale();
    drawLevels();
    redrawSoon();
  }
  // The library keeps a scale the reader dragged to until it is told to calculate again, and stating the axis type is what tells it (the
  // same thing its own double click on the axis does).
  function autoScale() {
    manual = false;
    try { chart.setStyles({ yAxis: { type: scaleType } }); } catch (e) {}
    paintScaleButtons();
  }
  function paintScaleButtons() {
    document.getElementById('sAuto').className = manual ? '' : 'on';
    document.getElementById('sLog').className = scaleType === 'log' ? 'on' : '';
    document.getElementById('sPct').className = scaleType === 'percentage' ? 'on' : '';
  }
  function markManual() { if (!manual) { manual = true; paintScaleButtons(); } }
  function tapButton(id, fn) {
    var b = document.getElementById(id);
    b.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
    ['touchstart', 'mousedown'].forEach(function (t) { b.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: true }); });
  }
  tapButton('sAuto', function () { refit(); });
  tapButton('sLog', function () { setScaleType(scaleType === 'log' ? 'normal' : 'log'); });
  tapButton('sPct', function () { setScaleType(scaleType === 'percentage' ? 'normal' : 'percentage'); });
  tapButton('toLatest', function () { try { chart.scrollToRealTime(250); } catch (e) {} });

  // What a double tap on the axis does in TradingView.
  function refit() {
    autoScale();
    drawCalls();
    drawLevels();
    redrawSoon();
  }

  // The scale buttons sit at the price axis's foot, just above the date axis; » sits left of them and shows only once the newest session is off screen.
  function placeControls() {
    var scales = document.getElementById('scales'), latest = document.getElementById('latest');
    var box = document.getElementById('chart').getBoundingClientRect();
    var xh = 28;
    try { var xs = chart.getSize('x_axis_pane'); if (xs && xs.height) xh = xs.height; } catch (e) {}
    scales.style.right = '4px';
    scales.style.bottom = (xh + 4) + 'px';
    latest.style.bottom = (xh + 4) + 'px';
    latest.style.right = (axisWidth() + 8) + 'px';
    var far = false;
    try {
      var r = chart.getVisibleRange();
      far = lastRows.length > 0 && r && r.realTo < lastRows.length - 1;
    } catch (e) {}
    latest.style.display = far ? 'flex' : 'none';
    scales.style.display = box.height > 0 ? 'flex' : 'none';
  }

  window.egxChart = {
    setData: setData, refit: refit, draw: draw, cancel: cancelPending, undo: undo, clearDrawings: clearDrawings,
    isManual: function () { return manual; },
    // What the reader changed on this page, for the app to keep: the indicators on, the lines drawn, and whether one is still being placed.
    state: function () {
      var on = ORDER.filter(function (n) { return !!active[n]; });
      return { indicators: on, drawings: serialize(), drawing: pending !== null };
    }
  };

  try { chart.subscribeAction('onVisibleRangeChange', redrawSoon); } catch (e) {}
  var box = document.getElementById('chart');
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () { try { chart.resize(); } catch (e) {} redrawSoon(); }).observe(box);

  // --- Both axes, by finger. The library scales them for a mouse dragged along them - up and down on the price axis, sideways on the
  // date axis - but not for a touch, so a finger on either strip is handed to it as the same drag. Touching the price axis switches to the
  // reader's own scale; a double tap on it goes back to the auto-fit. The chart's own touch handling (pan, fling, pinch, the crosshair a
  // long press leaves behind) is the library's and is not touched.
  var axisWidth = function () { try { return chart.getSize(PANE, 'yAxis').width || 60; } catch (e) { return 60; } };
  var xAxisTop = function () { try { var s = chart.getSize('x_axis_pane'); return s ? s.top : Infinity; } catch (e) { return Infinity; } };
  var drag = null, lastTap = 0;
  function mouse(type, target, t) {
    target.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY, button: 0, buttons: type === 'mouseup' ? 0 : 1 }));
  }
  box.addEventListener('touchstart', function (e) {
    var t = e.touches[0], r = box.getBoundingClientRect();
    if (e.touches.length !== 1) { drag = null; return; }
    var onPriceAxis = t.clientX >= r.right - axisWidth() && t.clientY <= r.top + chart.getSize(PANE, 'main').height;
    var onDateAxis = t.clientY >= r.top + xAxisTop() && t.clientX < r.right - axisWidth();
    if (!onPriceAxis && !onDateAxis) { drag = null; return; }
    e.preventDefault(); e.stopPropagation();
    if (onPriceAxis) {
      var now = Date.now();
      if (now - lastTap < 300) { lastTap = 0; drag = null; refit(); return; }
      lastTap = now;
    }
    var target = document.elementFromPoint(t.clientX, t.clientY);
    if (!target) return;
    drag = { target: target, price: onPriceAxis };
    mouse('mousedown', target, t);
  }, { capture: true, passive: false });
  box.addEventListener('touchmove', function (e) {
    if (!drag) return;
    e.preventDefault(); e.stopPropagation();
    if (drag.price) markManual();
    mouse('mousemove', drag.target, e.touches[0]);
    redrawSoon();
  }, { capture: true, passive: false });
  function endDrag(e) {
    if (!drag) return;
    e.preventDefault(); e.stopPropagation();
    var t = (e.changedTouches && e.changedTouches[0]) || { clientX: 0, clientY: 0, screenX: 0, screenY: 0 };
    mouse('mouseup', drag.target, t);
    drag = null;
    redrawSoon();
  }
  box.addEventListener('touchend', endDrag, { capture: true, passive: false });
  box.addEventListener('touchcancel', endDrag, { capture: true, passive: false });
  // The same on a desktop, for trying the page in a browser: dragging the axis is the library's own, a double click goes back to the auto-fit, which the library does itself.
  box.addEventListener('mousemove', function (e) { if (e.buttons === 1 && e.isTrusted) { var r = box.getBoundingClientRect(); if (e.clientX >= r.right - axisWidth()) { markManual(); redrawSoon(); } } }, true);
  box.addEventListener('dblclick', function (e) { var r = box.getBoundingClientRect(); if (e.clientX >= r.right - axisWidth()) { manual = false; paintScaleButtons(); redrawSoon(); } }, true);
</script>
</body>
