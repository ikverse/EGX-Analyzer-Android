name: Android

on:
  push:
    branches: [main, master]
    # Releases are cut by pushing a tag, which is also what the app checks for.
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21, because Robolectric refuses to build a sandbox for Android SDK 36 on anything older -
      # "requires Java 21 (have Java 17)" - and the migration and settings tests are Robolectric.
      # It is also what Android Studio's bundled JBR runs locally, so both sides agree.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored because the SDK path is per-machine; the runner's
      # ANDROID_HOME is already set, so Gradle resolves the SDK without it.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  # What the app updates itself from. A tag is the whole release process: this signs a release
  # build with the key every previous release was signed with, and publishes it where the app
  # looks. Behind the build job, so a tag that fails its tests never becomes a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # A tag ending in -next releases the side-by-side redesign instead of the real app: a
      # different applicationId, and published as a prerelease so it stays out of
      # `releases/latest`, which is the one endpoint the in-app updater reads. Neither device is
      # ever offered it; the different package id is the second layer under that.
      #
      # Parameterised rather than a second job, so the signing, the Telegram guard and the naming
      # below exist once and cannot drift apart between the two kinds of release.
      - name: Decide what this tag releases
        id: target
        run: |
          if [[ "$GITHUB_REF_NAME" == *-next ]]; then
            echo "variant=next" >> "$GITHUB_OUTPUT"
            echo "task=assembleNext" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      # Refused rather than skipped: an unsigned APK attached to a release is one every device
      # would offer and none could install.
      - name: Restore the signing key
        env:
          EGX_KEYSTORE_BASE64: ${{ secrets.EGX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$EGX_KEYSTORE_BASE64" ]; then
            echo "EGX_KEYSTORE_BASE64 is not set; a release cannot be signed." >&2
            exit 1
          fi
          printf '%s' "$EGX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/egx-release.jks"

      # -PabiSplits is what turns on one APK per architecture; without it this builds the single
      # APK every other build here produces. See the splits block in app/build.gradle.kts.
      - name: Assemble release
        env:
          EGX_KEYSTORE_FILE: ${{ runner.temp }}/egx-release.jks
          EGX_KEYSTORE_PASSWORD: ${{ secrets.EGX_KEYSTORE_PASSWORD }}
          EGX_KEY_ALIAS: ${{ secrets.EGX_KEY_ALIAS }}
          EGX_KEY_PASSWORD: ${{ secrets.EGX_KEY_PASSWORD }}
          # local.properties is gitignored, so a build here has none of it. Without these the app
          # cannot reach Telegram at all and asks its user to register an application at
          # my.telegram.org before it will show a sign-in code.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # Named rather than interpolated straight into the command line, so that a decision step
          # which did not run leaves an empty variable this can refuse - where `:app:` with nothing
          # after it reaches Gradle as "cannot locate tasks that match ':app:'", eleven seconds into
          # a release, saying nothing about the step that was actually missing. That has happened:
          # the decision step was added to the build job by mistake, where `steps.target` is not
          # visible from here and every output silently reads as empty.
          task="${{ steps.target.outputs.task }}"
          if [ -z "$task" ]; then
            echo "No assemble task was decided. The 'Decide what this tag releases' step has to be in this job, before this one." >&2
            exit 1
          fi
          ./gradlew ":app:$task" -PabiSplits --no-daemon

      # A release that cannot sign in to Telegram does nothing this app is for, and the failure only
      # surfaces on a phone after an install. Cheaper to refuse the release than to publish one.
      - name: Refuse a release with no Telegram credentials
        run: |
          if ! grep -q 'TELEGRAM_API_ID = [1-9]' "app/build/generated/source/buildConfig/${{ steps.target.outputs.variant }}/com/ikverse/egxanalyzer/BuildConfig.java"; then
            echo "The release build has no Telegram api_id; set the TELEGRAM_API_ID and TELEGRAM_API_HASH secrets." >&2
            exit 1
          fi

      # The signing config reaching a build type is not something the development machine can check:
      # it holds no key, so every build there is unsigned whether the wiring is right or not. The
      # first build that could tell us is this one, and left unguarded the answer would arrive as a
      # published release every device is offered and none can install. An unsigned APK is named for
      # it, so this is the cheapest place to catch it.
      - name: Refuse an unsigned build
        run: |
          dir="app/build/outputs/apk/${{ steps.target.outputs.variant }}"
          if ls "$dir"/*-unsigned.apk >/dev/null 2>&1; then
            echo "The release build produced unsigned APKs, so its signing config is not wired up." >&2
            ls -la "$dir" >&2
            exit 1
          fi

      # Named for the version and the architecture, because those names are what the app matches
      # against its own device and what a person picks from when installing by hand.
      - name: Name the APKs for their version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk/${{ steps.target.outputs.variant }}
          # Whatever the split produced, rather than a list that has to be kept in step with
          # build.gradle.kts - a name in this loop that the build no longer makes fails the release
          # at its last step, with the APKs built and nothing published.
          for apk in app-*-${{ steps.target.outputs.variant }}.apk; do
            abi="${apk#app-}"
            abi="${abi%-${{ steps.target.outputs.variant }}.apk}"
            mv "$apk" "egx-analyzer-$version-$abi.apk"
          done
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/${{ steps.target.outputs.variant }}/egx-analyzer-*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes ${{ steps.target.outputs.prerelease }}

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/egx-release.jks"
