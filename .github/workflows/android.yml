name: Android

on:
  push:
    branches: [main, master]
    # Releases are cut by pushing a tag, which is also what the app checks for.
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21, because Robolectric refuses to build a sandbox for Android SDK 36 on anything older -
      # "requires Java 21 (have Java 17)" - and the migration and settings tests are Robolectric.
      # It is also what Android Studio's bundled JBR runs locally, so both sides agree.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored because the SDK path is per-machine; the runner's
      # ANDROID_HOME is already set, so Gradle resolves the SDK without it.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  # What the app updates itself from. A tag is the whole release process: this signs a release
  # build with the key every previous release was signed with, and publishes it where the app
  # looks. Behind the build job, so a tag that fails its tests never becomes a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Refused rather than skipped: an unsigned APK attached to a release is one every device
      # would offer and none could install.
      - name: Restore the signing key
        env:
          EGX_KEYSTORE_BASE64: ${{ secrets.EGX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$EGX_KEYSTORE_BASE64" ]; then
            echo "EGX_KEYSTORE_BASE64 is not set; a release cannot be signed." >&2
            exit 1
          fi
          printf '%s' "$EGX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/egx-release.jks"

      # -PabiSplits is what turns on one APK per architecture; without it this builds the single
      # APK every other build here produces. See the splits block in app/build.gradle.kts.
      - name: Assemble release
        env:
          EGX_KEYSTORE_FILE: ${{ runner.temp }}/egx-release.jks
          EGX_KEYSTORE_PASSWORD: ${{ secrets.EGX_KEYSTORE_PASSWORD }}
          EGX_KEY_ALIAS: ${{ secrets.EGX_KEY_ALIAS }}
          EGX_KEY_PASSWORD: ${{ secrets.EGX_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PabiSplits --no-daemon

      # Named for the version and the architecture, because those names are what the app matches
      # against its own device and what a person picks from when installing by hand.
      - name: Name the APKs for their version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk/release
          for abi in arm64-v8a x86_64 universal; do
            mv "app-$abi-release.apk" "egx-analyzer-$version-$abi.apk"
          done
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/egx-analyzer-*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/egx-release.jks"
